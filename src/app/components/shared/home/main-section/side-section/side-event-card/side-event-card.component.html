@if ((data.illustrations).length > 0) {
<img [src]="data.illustrations[0]" alt="Event illustration" class="object-cover h-[150px] w-full rounded-t-xl object-cover" />
} @else {
<img [src]="randomPic" alt="Event illustration" class="object-cover h-[150px] w-full rounded-t-xl object-cover" />
}
<div id="infos-card" class="px-4 pt-3 pb-2 rounded-b-xl">
  <h4 class="inline-flex items-center text-lg font-semibold">
    {{ data.title }}
  </h4>
  <p class="mt-3 text-xs">
    <i class="fa-solid fa-calendar-days mr-2"></i> {{ data.startDate | date:'medium' }}
  </p>
  <p class="mt-2 text-xs">
    <i class="fa-solid fa-map-pin mr-3"></i> {{ data.street }} {{ data.city }} {{ data.postalCode }}
  </p>
  <p class="mt-2 text-xs">
    <i class="fa-solid fa-users mr-2"></i>{{ data.participants.length }} participant{{ data.participants.length > 1 ? "s" : "" }}
  </p>

    class="mt-4 w-full rounded-sm bg-black px-2 py-1.5 text-sm font-semibold text-white shadow-sm hover:bg-black/80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black dark:focus-visible:outline-white transition-all duration-300">
    Participer
  </button> -->
</div>
