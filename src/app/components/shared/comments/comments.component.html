@for (comment of comments; track comment.id) {
<div class="border rounded-md mb-3 p-2">
    <div class="flex flex-row justify-between mb-2">
        <a [routerLink]="'/hello/neighbors/user/' + comment.author.id">
            <i class="fa-solid fa-user"></i>
            {{ comment.author.pseudonym || comment.author.firstname + " " + comment.author.lastname }}
        </a>  
        <span>date</span>
    </div>
    {{ comment.body }}
</div>
} @empty {
Il n'y a pas encore de commentaire
}
<div class="flex flex-row items-end mt-2">
    <textarea [(ngModel)]="text" class="flex-grow mr-3 bg-gray-100 rounded-md" style="margin-right: 15px;"></textarea>
    <i class="fa-solid fa-circle-right text-2xl" (click)="onPostComment($event)"></i>
</div>
