<img src="./logo.png" alt="Hello Neighbors logo" class="w-38 h-auto absolute left-0 top-0 z-100">
<header class="bg-white">
  <div class="mx-auto max-w-screen-xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-end">
      <div class="md:flex md:items-center md:gap-12">

        <div class="flex items-center gap-4">
          <!-- Version texte (tablette et plus) -->
          <div class="hidden sm:flex gap-4">
            <a routerLink="/hello/neighbors/login" routerLinkActive="active" ariaCurrentWhenActive="page"
              class="rounded-md border border-teal-600 px-5 py-2.5 text-sm font-medium text-teal-600 hover:bg-teal-50 transition">
              Connexion
            </a>

            <a routerLink="/hello/neighbors/signup"
              class="rounded-md bg-teal-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-teal-700 transition">
              Inscription
            </a>
          </div>

          <!-- Version icônes (mobile) -->
          <div class="flex sm:hidden gap-2">
            <a routerLink="/hello/neighbors/login" class="p-2 text-gray-600 hover:text-teal-600 transition"
              title="Connexion">
              <i class="fa-solid fa-right-to-bracket"></i>
              <span class="sr-only">Connexion</span>
            </a>

            <a routerLink="/hello/neighbors/signup" class="p-2 text-gray-600 hover:text-teal-600 transition"
              title="Inscription">
              <i class="fa-solid fa-user-plus"></i>
              <span class="sr-only">Inscription</span>
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</header>
