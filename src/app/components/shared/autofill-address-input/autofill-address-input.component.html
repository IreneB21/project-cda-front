<div class="relative">
    <input
      type="text"
      [formControl]="addressControl"
      placeholder="Adresse complète *"
      class="peer mt-0.5 w-full rounded border-gray-300 
        shadow-[0px_2px_3px_-1px_rgba(0,0,0,0.1),0px_1px_0px_0px_rgba(25,28,33,0.02),0px_0px_0px_1px_rgba(25,28,33,0.08)] sm:text-sm p-2"  
      (keydown)="onKeyDown($event)"
    />
  
    <div
      *ngIf="suggestions.length"
      class="absolute z-10 w-full border bg-white rounded shadow"
    >
      <div
        *ngFor="let item of suggestions; let i = index"
        [ngClass]="{
          'bg-gray-200': i === focusedIndex,
          'cursor-pointer': true,
          'px-4 py-2': true
        }"
        (click)="select(item)"
      >
        {{ item.formatted }}
      </div>
    </div>
  </div>
