<app-header-authentification></app-header-authentification>

<div class="min-h-screen relative w-full flex flex-col lg:flex-row">
    <!-- Form Section -->
    <div class="relative w-full lg:w-1/2 flex flex-col justify-center py-4 px-8 md:p-24 lg:p-32 bg-white/90 lg:bg-white z-10">
        <div class="relative z-10 flex flex-col justify-center md:justify-start pt-8 md:pt-0">
            <!-- Title -->
            <h2 class="text-center text-3xl">Connexion</h2>

            <!-- Form -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col pt-3 md:pt-8 space-y-4 gap-3">
                <!-- Email -->
                <label class="relative">
                    <input formControlName="email" type="email" placeholder="Email" formControlName="email" 
                        class="peer mt-0.5 w-full rounded border-gray-300 
                        shadow-[0px_2px_3px_-1px_rgba(0,0,0,0.1),0px_1px_0px_0px_rgba(25,28,33,0.02),0px_0px_0px_1px_rgba(25,28,33,0.08)] sm:text-sm p-2" />
                </label>
                <!-- Password -->
                <label class="relative">
                    <input formControlName="password" type="password" placeholder="Mot de passe" formControlName="password" 
                        class="peer mt-0.5 w-full rounded border-gray-300 
                        shadow-[0px_2px_3px_-1px_rgba(0,0,0,0.1),0px_1px_0px_0px_rgba(25,28,33,0.02),0px_0px_0px_1px_rgba(25,28,33,0.08)] sm:text-sm p-2" />
                </label>
                <!-- Submit Button -->
                <button type="submit" [disabled]="!loginForm.valid" class="mb-3 px-4 py-2 bg-black text-white rounded-lg hover:bg-blue-600">
                    Soumettre
                </button>
            </form>

            <div class="text-center">Pas encore membre ? <em><a routerLink="/hello/neighbors/signup">Inscrivez-vous</a></em></div>
        </div>
    </div>

    <!-- Illustration section -->
    <div class="hidden lg:block w-full lg:w-1/2">
        <img
        src="/registration-illustration.jpg"
        alt=""
        class="h-full w-full object-cover"
        />
    </div>
</div>
