@if (posts.length === 0) {
    <div class="w-full flex flex-col justify-center items-center pt-3 pb-5">
        <img src="/no-publications.png" class="my-8 w-80" alt="">
        <h6>
            Vous n'avez encore rien publié, lancez-vous ! 
            <i class="fa-regular fa-circle-down animate-bounce"></i>
        </h6>
    </div>
    <app-post-making-form class="w-full"></app-post-making-form>
} @else {
    <app-post-making-form class="w-full mb-3"></app-post-making-form>
    <div class="flex flex-col gap-3 w-full">
        <div class="flex flex-col gap-3">
            @for (post of posts; track post.id) {
                @if (post.category === 'event') {
                    <app-event-card [data]="post"></app-event-card>
                } @else {
                    <app-publication-card [data]="post"></app-publication-card>
                }
            }
        </div>
    </div>
}
