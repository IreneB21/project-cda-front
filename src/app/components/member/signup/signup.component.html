<app-header-authentification></app-header-authentification>

<div class="relative w-full flex flex-col lg:flex-row">
  
  <!-- Formulaire - image en fond en mobile/tablette -->
  <div
    class="relative w-full lg:w-1/2 flex flex-col justify-center py-4 px-8 md:p-24 lg:p-32 bg-white/90 lg:bg-white z-10"
  >
    <!-- Image en fond (mobile) -->
    <img
      src="/registration-illustration.jpg"
      alt=""
      class="absolute inset-0 h-full w-full object-cover brightness-50 lg:hidden z-0"
      aria-hidden="true"
    />

    <div class="relative z-10 flex flex-col justify-center md:justify-start pt-8 md:pt-0">
      <h2 class="text-center text-3xl">Inscription</h2>

      <!-- Form -->
      <form [formGroup]="registrationForm" (ngSubmit)="submitForm()" class="flex flex-col pt-3 md:pt-8 space-y-4 gap-3">

        <label for="lastname" class="relative">
            <input type="text" id="lastname" placeholder="Nom" formControlName="lastname" 
                class="peer mt-0.5 w-full rounded border-gray-300 
                shadow-[0px_2px_3px_-1px_rgba(0,0,0,0.1),0px_1px_0px_0px_rgba(25,28,33,0.02),0px_0px_0px_1px_rgba(25,28,33,0.08)] sm:text-sm p-2" />
        </label>

        <!-- Prénom -->
        <label for="firstname" class="relative">
            <input type="text" id="firstname" placeholder="Prénom" formControlName="firstname" 
                class="peer mt-0.5 w-full rounded border-gray-300 
                shadow-[0px_2px_3px_-1px_rgba(0,0,0,0.1),0px_1px_0px_0px_rgba(25,28,33,0.02),0px_0px_0px_1px_rgba(25,28,33,0.08)] sm:text-sm p-2" />
        </label>

        <!-- Pseudonyme -->
        <label for="pseudonym" class="relative">
            <input type="text" id="pseudonym" placeholder="Pseudonyme" formControlName="pseudonym" 
                class="peer mt-0.5 w-full rounded border-gray-300 
                shadow-[0px_2px_3px_-1px_rgba(0,0,0,0.1),0px_1px_0px_0px_rgba(25,28,33,0.02),0px_0px_0px_1px_rgba(25,28,33,0.08)] sm:text-sm p-2" />
        </label>

        <!-- Mot de passe -->
        <label for="password" class="relative">
            <input type="password" id="password" placeholder="Mot de passe" formControlName="password" 
                class="peer mt-0.5 w-full rounded border-gray-300 
                shadow-[0px_2px_3px_-1px_rgba(0,0,0,0.1),0px_1px_0px_0px_rgba(25,28,33,0.02),0px_0px_0px_1px_rgba(25,28,33,0.08)] sm:text-sm p-2" />
        </label>

        <!-- Email -->
        <label for="email" class="relative">
            <input type="email" id="email" placeholder="Email" formControlName="email" 
                class="peer mt-0.5 w-full rounded border-gray-300 
                shadow-[0px_2px_3px_-1px_rgba(0,0,0,0.1),0px_1px_0px_0px_rgba(25,28,33,0.02),0px_0px_0px_1px_rgba(25,28,33,0.08)] sm:text-sm p-2" />
        </label>

        <!-- Adresse -->
       <app-autofill-address-input
            formControlName="address"
            placeholder="Adresse complète"
            (addressSelected)="onAddressSelected($event)"
        ></app-autofill-address-input>
       

        <!-- Sélection résidence -->
        <div class="flex space-x-4">
            <p>Où habitez vous ?</p>
            <label class="flex items-center">
                <input type="radio" formControlName="residence" value="ville" class="mr-2" /> Ville
            </label>
            <label class="flex items-center">
                <input type="radio" formControlName="residence" value="campagne" class="mr-2" /> Campagne
            </label>
        </div>

        <!-- Bouton Soumettre -->
        <button type="submit" [disabled]="!registrationForm.valid" class="mt-4 px-4 py-2 bg-black text-white rounded-lg hover:bg-blue-600">
            Soumettre
        </button>
      </form>
    </div>
  </div>

  <!-- Image à droite sur desktop -->
  <div class="hidden lg:block w-full lg:w-1/2">
    <img
      src="/registration-illustration.jpg"
      alt=""
      class="h-full w-full object-cover"
    />
  </div>
</div>
